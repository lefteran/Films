name: Add Movie

on:
  workflow_dispatch:
    inputs:
      imdb_id:
        description: "IMDb ID (e.g. tt0111161)"
        required: true
        type: string
      list_no:
        description: "List number / shelf ID"
        required: true
        type: string

permissions:
  contents: write

jobs:
  add-movie:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Add movie
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_BASE_URL: ${{ secrets.AI_BASE_URL }}
          AI_MODEL: ${{ secrets.AI_MODEL }}
        run: python scripts/add_movie.py --imdb_id "${{ github.event.inputs.imdb_id }}" --list_no "${{ github.event.inputs.list_no }}"

      - name: Commit and push
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add data/
          git commit -m "Add movie via UI: ${{ github.event.inputs.imdb_id }}"
          git push
